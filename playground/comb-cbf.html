<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combinatorial CBF Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --panel:rgba(14,19,26,.82); --line:rgba(255,255,255,.09);
    --ink:#e6edf3; --mute:#8b98a5; --l1:#2dd4bf; --l2:#f5a524; --out:#94a3b8;
    --ok:#4ade80; --bad:#f87171; --accent:#7dd3fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
  #scene{position:fixed;inset:0}
  .panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .mono{font-family:inherit}
  /* counters */
  #hud{top:16px;left:16px;width:290px}
  .hudrow{display:grid;grid-template-columns:1fr auto;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line)}
  .hudrow:last-of-type{border-bottom:none}
  .hudlabel{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
  .big{font-size:30px;font-weight:600;line-height:1}
  .req{font-size:11px;color:var(--mute);margin-left:4px}
  .pips{display:flex;gap:3px;margin-top:6px}
  .pip{flex:1;max-width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.08)}
  #status{margin-top:10px;padding:9px 10px;border-radius:8px;font-size:12px;
    display:flex;justify-content:space-between;align-items:center}
  #status.safe{background:rgba(74,222,128,.1);color:var(--ok)}
  #status.unsafe{background:rgba(248,113,113,.12);color:var(--bad)}
  #status.adjust{background:rgba(251,191,36,.12);color:#fbbf24}
  #metrics{margin-top:8px;font-size:11px;color:var(--mute);display:grid;
    grid-template-columns:1fr 1fr;gap:4px 10px}
  #metrics b{color:var(--ink);font-weight:500}
  /* controls */
  #ctrl{left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 14px}
  .sep{width:1px;align-self:stretch;background:var(--line)}
  .crow{display:flex;align-items:center;gap:8px;font-size:12px;flex:1 1 210px;min-width:200px}
  .crow label{color:var(--mute);flex:none;display:flex;align-items:center;gap:6px}
  .hintsm{font-size:10.5px;opacity:.75}
  .crow input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
  .req1 input[type=range]{accent-color:var(--l1)} .req2 input[type=range]{accent-color:var(--l2)}
  .crow .val{width:42px;text-align:right;font-size:11.5px;white-space:nowrap} .crow .val.wide{width:62px}
  .btns{display:flex;gap:8px;flex:none}
  button{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;font:500 12px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
  button:hover{background:rgba(255,255,255,.12)}
  button.on{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.5);color:var(--accent)}
  button.off{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.5);color:var(--bad)}
  .toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
  .toggles input{accent-color:var(--accent)}
  /* chart */
  #chartbox{top:16px;right:16px;width:min(430px, calc(100vw - 354px));min-width:240px}
  #chartbox .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:6px}
  #chart{width:100%;height:170px;display:block}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--mute)}
  .legend span{display:flex;align-items:center;gap:5px}
  #hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);font-size:11.5px;color:var(--mute);
    background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
  @media (max-width: 1000px){ #hint{display:none} }
  @media (max-width: 760px){
    #hud{width:min(46vw, 290px);padding:10px 12px} #metrics{display:none} #hud .hudrow{padding:5px 0}
    #chartbox{width:calc(100vw - min(46vw, 290px) - 44px);min-width:0;padding:10px 12px} #chartbox .legend{display:none}
    #ctrl .sep,#ctrl .toggles,#ctrl .adv{display:none} .btns{flex:1 1 100%;flex-wrap:wrap} .big{font-size:22px}
  }
</style>
</head>
<body>
<div id="scene"></div>

<div id="hint">drag to orbit · scroll to zoom · right-drag to pan</div>

<div id="hud" class="panel">
  <div class="hudrow">
    <div><div class="hudlabel"><span class="sw" style="background:var(--l1)"></span>Watching L₁</div>
      <div class="pips" id="pipsL1"></div></div>
    <div><span class="big" id="cL1" style="color:var(--l1)">0</span><span class="req" id="qL1">≥4</span></div>
  </div>
  <div class="hudrow">
    <div><div class="hudlabel"><span class="sw" style="background:var(--l2)"></span>Watching L₂</div>
      <div class="pips" id="pipsL2"></div></div>
    <div><span class="big" id="cL2" style="color:var(--l2)">0</span><span class="req" id="qL2">≥4</span></div>
  </div>
  <div class="hudrow">
    <div><div class="hudlabel"><span class="sw" style="background:var(--out)"></span>In transit (outside)</div>
      <div class="pips" id="pipsOut"></div></div>
    <div><span class="big" id="cOut">0</span><span class="req" id="qOut">≤3</span></div>
  </div>
  <div id="status" class="safe mono"><span id="statusTxt">SAFE</span><span id="hval">h = 0.00</span></div>
  <div id="metrics" class="mono">
    <div>t <b id="mT">0.0 s</b></div>
    <div>CBF active <b id="mAct">0</b></div>
    <div>min sep <b id="mSep">–</b></div>
    <div>violations <b id="mViol">0</b></div>
    <div>peak |u| <b id="mU">0.00</b></div>
    <div>bound <b id="mUB">1.00 m/s</b></div>
  </div>
</div>

<div id="ctrl" class="panel">
  <div class="btns">
    <button id="bPlay" class="on">❚❚ Pause</button>
    <button id="bReset">↺ Reset</button>
    <button id="bSeed">⚄ New patrol plan</button>
    <button id="bFilter" class="on">CBF filter: ON</button>
  </div>
  <div class="sep"></div>
  <div class="crow req1"><label><span class="sw" style="background:var(--l1)"></span>Required in L₁ r₁</label><input id="sR1" type="range" min="1" max="12" step="1" value="4"><span class="val" id="vR1">4</span></div>
  <div class="crow req2"><label><span class="sw" style="background:var(--l2)"></span>Required in L₂ r₂</label><input id="sR2" type="range" min="1" max="12" step="1" value="4"><span class="val" id="vR2">4</span></div>
  <div class="crow"><label title="changing N restarts the run; N ≥ r₁ + r₂">Drones N <span class="hintsm">(restarts)</span></label><input id="sN" type="range" min="8" max="24" step="1" value="11"><span class="val" id="vN">11</span></div>
  <div class="sep"></div>
  <div class="crow adv"><label title="per-axis input bound |u_x|, |u_y| ≤ value">Input bound</label><input id="sU" type="range" min="0.25" max="3.25" step="0.25" value="1"><span class="val wide" id="vU">1.00 m/s</span></div>
  <div class="crow adv"><label>CBF gain α</label><input id="sA" type="range" min="0.5" max="6" step="0.5" value="2"><span class="val" id="vA">2.0</span></div>
  <div class="crow adv"><label title="ḣ_k ≥ −α(h_k) − ρ·ReLU(α(h) − α(h_k)).  ρ = 2 is the paper's constraint; ρ ≥ 1 keeps u = 0 feasible.">Relaxation ρ</label><input id="sRho" type="range" min="1" max="8" step="0.25" value="2"><span class="val wide" id="vRho">2.0 paper</span></div>
  <div class="crow"><label>Sim speed</label><input id="sSpd" type="range" min="0.25" max="8" step="0.25" value="2"><span class="val" id="vSpd">2×</span></div>
  <div class="sep"></div>
  <div class="toggles">
    <label><input type="checkbox" id="tNom"> nominal command</label>
    <label><input type="checkbox" id="tTrail" checked> trails</label>
    <label><input type="checkbox" id="tRail" checked> patrol lanes</label>
    <label><input type="checkbox" id="tRot"> auto-rotate</label>
  </div>
</div>

<div id="chartbox" class="panel">
  <div class="hd"><span>Coverage over the last 50 s</span>
    <div class="legend"><span><i class="sw" style="background:var(--l1)"></i>L1</span>
      <span><i class="sw" style="background:var(--l2)"></i>L2</span>
      <span><i class="sw" style="background:var(--out)"></i>outside</span></div></div>
  <canvas id="chart"></canvas>
</div>

<!-- ======================= Simulation core (pure JS, no rendering) ======================= -->
<script>
// SIM-BEGIN
// Port of joonlee16/combinatorial_cbf (config.py, L_shape.py, controller.py, simulation.py),
// generalised to any number of drones N and with the whole layout scaled by SCALE.
// For N = 11 the paper's initial positions and amplitude pattern are used (scaled).
const SIM = (() => {
  const SCALE = 1.6;                 // enlarge the L-regions (and patrol ranges) uniformly
  const DT = 0.05, KAPPA = 2.0, NMAX = 24;
  // Half-planes [nx, ny, c]: h = nx*x + ny*y + c >= 0 (unit inward normals) in the paper's units.
  // Edges 0,1 form the OR pair at the notch; edges 2..5 are the AND box.
  // L1 is the left L and L2 the right L (the paper's code has them the other way round; the scene is
  // mirror-symmetric in x, so this is an exact mirror image: initial positions and patrol signs are
  // mirrored too, giving the mirror image of the paper's trajectories).
  const MIRROR = -1;
  const BASE = [
    { name: 'L1', cx: -3.5, H: [[0,-1,0],[1,0,3.5],[0,-1,2],[-1,0,-1.5],[0,1,2],[1,0,5.5]],
      poly: [[-5.5,0],[-3.5,0],[-3.5,2],[-1.5,2],[-1.5,-2],[-5.5,-2]] },
    { name: 'L2', cx: 3.5, H: [[0,-1,0],[-1,0,3.5],[0,-1,2],[1,0,-1.5],[0,1,2],[-1,0,5.5]],
      poly: [[5.5,0],[3.5,0],[3.5,2],[1.5,2],[1.5,-2],[5.5,-2]] },
  ];
  const REGIONS = BASE.map(r => ({ name: r.name, cx: r.cx*SCALE,
    H: r.H.map(([a,b,c]) => [a, b, c*SCALE]), poly: r.poly.map(([x,y]) => [x*SCALE, y*SCALE]) }));
  const INIT11 = [
    [3.5-0.20,-1.70],[3.5-2.00,-0.15],[3.5+1.50,-0.60],[3.5-0.50,0.90],[3.5-1.30,0.35],[3.5-1.70,1.95],
    [-3.5-1.55,-1.35],[-3.5-0.30,-1.00],[-3.5+2.00,1.20],[-3.5+0.40,0.65],[-3.5+1.20,0.10],
  ];
  const AMAG11 = [5,5,5,3,3,3,5,5,3,3,3];

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

  // Initial positions + patrol amplitudes. Every drone gets its own y-lane. n1 lanes start in L1 and
  // N-n1 in L2, with n1 chosen so that L1 starts with >= r1 drones and L2 with >= r2 (possible whenever
  // N >= r1 + r2); the L1 lanes are spread evenly among all lanes. For N = 11 with r1 <= 6 and r2 <= 5
  // the paper's own initial positions are used.
  function layout(N, rnd, r1, r2){
    if (N === 11 && r1 <= 6 && r2 <= 5) return { init: INIT11.map(([x,y]) => [MIRROR*x*SCALE, y*SCALE]), amag: AMAG11.map(a => a*SCALE) };
    const init = [], amag = [];
    const ymax = 1.85;
    const n1 = Math.min(N - r2, Math.max(r1, Math.round(N*r1/Math.max(1, r1 + r2))));
    for (let j=0;j<N;j++){
      const y = -ymax + 2*ymax*(N===1?0.5:j/(N-1));
      const inL1 = Math.floor((j+1)*n1/N) > Math.floor(j*n1/N);
      // x range inside the L at this lane (notch removes the outer half above y=0)
      const lo = 1.5 + 0.15, hi = (y > 0 ? 3.5 : 5.5) - 0.15;
      const x = lo + (hi-lo)*rnd();
      init.push([(inL1 ? MIRROR*x : -MIRROR*x)*SCALE, y*SCALE]);
      amag.push((j % 4 < 2 ? 5 : 3)*SCALE);
    }
    return { init, amag };
  }

  function makePlan(seed, N, r1, r2){
    const rnd = mulberry32(seed);
    const { init, amag } = layout(N, rnd, r1, r2);
    const A = amag.map(a => MIRROR * a * (rnd() < 0.5 ? -1 : 1));
    const W = amag.map(() => (0.02 + 0.08*rnd()) * Math.PI);
    return { A, W, init, seed };
  }

  const hRaw = (h, x, y) => h[0]*x + h[1]*y + h[2];
  function hL(reg, x, y){
    const v = reg.H.map(h => hRaw(h, x, y));
    return Math.min(Math.max(v[0], v[1]), v[2], v[3], v[4], v[5]);
  }
  function rthLargest(arr, r){ const s = arr.slice().sort((a,b)=>b-a); return s[Math.min(r, arr.length)-1]; }

  // Exact 2D QP: min |u-ud|^2  s.t.  a.u >= b  for each [ax, ay, b].
  function qp2(ud, cons){
    const ok = (u) => { for (const c of cons) if (c[0]*u[0]+c[1]*u[1] < c[2]-1e-9) return false; return true; };
    if (ok(ud)) return { u: ud, feasible: true };
    let best = null, bd = Infinity;
    const tryU = (u) => { if (ok(u)) { const d=(u[0]-ud[0])**2+(u[1]-ud[1])**2; if (d<bd){bd=d;best=u;} } };
    for (const c of cons){
      const s = (c[2] - (c[0]*ud[0]+c[1]*ud[1])) / (c[0]*c[0]+c[1]*c[1]);
      if (s > 0) tryU([ud[0]+s*c[0], ud[1]+s*c[1]]);
    }
    for (let i=0;i<cons.length;i++) for (let k=i+1;k<cons.length;k++){
      const a=cons[i], b=cons[k], det=a[0]*b[1]-a[1]*b[0];
      if (Math.abs(det) < 1e-12) continue;
      tryU([(a[2]*b[1]-a[1]*b[2])/det, (a[0]*b[2]-a[2]*b[0])/det]);
    }
    if (best) return { u: best, feasible: true };
    // Infeasible (only possible when h<0, e.g. right after raising r): least-violation fallback.
    let fb=[0,0], fv=Infinity;
    const cands=[ud,[0,0]]; for (const c of cons){const s=(c[2]-(c[0]*ud[0]+c[1]*ud[1]))/(c[0]*c[0]+c[1]*c[1]); cands.push([ud[0]+s*c[0],ud[1]+s*c[1]]);}
    for (const u of cands){ let v=0; for (const c of cons) v+=Math.max(0,c[2]-(c[0]*u[0]+c[1]*u[1])); if(v<fv){fv=v;fb=u;} }
    return { u: fb, feasible: false };
  }

  function create(seed, N = 11, r1 = 4, r2 = 4){
    const plan = makePlan(seed, N, r1, r2);
    return { N, t: 0, step: 0, plan,
      p: plan.init.map(q => q.slice()), u: plan.init.map(()=>[0,0]), ud: plan.init.map(()=>[0,0]),
      hL1: new Array(N).fill(0), hL2: new Array(N).fill(0), active: new Array(N).fill(false),
      pivot: 0, feasible: true };
  }

  function refreshH(S){ for (let j=0;j<S.N;j++){ S.hL1[j] = hL(REGIONS[0], S.p[j][0], S.p[j][1]); S.hL2[j] = hL(REGIONS[1], S.p[j][0], S.p[j][1]); } }

  function step(S, opt){
    const { r = 4, alpha = 2.0, rho = 2.0, filter = true, umax = Infinity } = opt || {};
    const r1 = (opt && opt.r1) || r, r2 = (opt && opt.r2) || r;   // per-region requirements (r1 for L1, r2 for L2)
    const sat = v => Math.max(-umax, Math.min(umax, v));
    const N = S.N;
    S.step += 1; const t = S.step * DT;   // matches compute_u_des(..., t) with t*0.05
    const { A, W } = S.plan;
    refreshH(S);
    // h(x) = min( max^{r1}_j hL1(x_j), max^{r2}_j hL2(x_j) ): r1-of-N over L1 AND r2-of-N over L2
    const pivot = Math.min(rthLargest(S.hL1, r1), rthLargest(S.hL2, r2));
    S.pivot = pivot; S.feasible = true;
    for (let j=0;j<N;j++){
      const [x,y] = S.p[j];
      const rec = opt && opt.recruit ? opt.recruit[j] : null;
      const xd = rec !== null && rec !== undefined ? rec : A[j]*Math.sin(W[j]*t);
      const xdd = rec !== null && rec !== undefined ? 0 : A[j]*W[j]*Math.cos(W[j]*t);
      const ud = [KAPPA*(xd - x) + xdd, 0];
      S.ud[j] = ud;
      let u = ud;
      if (filter){
        const cons = [];
        for (const reg of REGIONS) for (const h of reg.H){
          const hk = hRaw(h, x, y);
          // ḣ_k ≥ −α(h_k) − ρ·ReLU(α(h) − α(h_k)),  α(s) = alpha·s.  ρ = 2 is the paper's
          // ḣ_k ≥ −α(h + |h_k − h|); ρ only changes how fast the slack constraints (h_k < h) may decay.
          cons.push([h[0], h[1], -alpha*hk - rho*Math.max(0, alpha*pivot - alpha*hk)]);
        }
        // input bounds |u_x|, |u_y| <= umax (linear, so the per-drone QP stays exact)
        if (isFinite(umax)) cons.push([1,0,-umax], [-1,0,-umax], [0,1,-umax], [0,-1,-umax]);
        const sol = qp2(ud, cons); u = sol.u; if (!sol.feasible) S.feasible = false;
        if (!sol.feasible) u = [sat(u[0]), sat(u[1])];   // never exceed the actuator limit
      } else {
        u = [sat(ud[0]), sat(ud[1])];                     // unfiltered: nominal command, saturated
      }
      S.u[j] = u;
      S.active[j] = Math.hypot(u[0]-ud[0], u[1]-ud[1]) > 0.03;
    }
    for (let j=0;j<N;j++){ S.p[j][0] += DT*S.u[j][0]; S.p[j][1] += DT*S.u[j][1]; }
    refreshH(S);
    S.t = t;
    return S;
  }

  function counts(S){
    let c1=0,c2=0,out=0;
    for (let j=0;j<S.N;j++){ const a=S.hL1[j]>=-1e-6, b=S.hL2[j]>=-1e-6; if(a)c1++; if(b)c2++; if(!a&&!b)out++; }
    return { c1, c2, out };
  }
  function barrier(S, r1, r2 = r1){ return Math.min(rthLargest(S.hL1, r1), rthLargest(S.hL2, r2)); }

  // Requirement supervisor (lets r1, r2 change mid-run without a restart). The CBF enforces the
  // effective requirements eff = (r1, r2). Lowering a target takes effect at once: the safe set only
  // grows. Raising one is done one drone at a time: eff.rk is incremented only when the current state
  // already lies in the safe set for rk + 1, i.e. when the patrol has carried an extra drone into the
  // region; the CBF then keeps it there. So h(x; eff) >= 0 holds at every instant, and eff climbs to the
  // target as the drones' own patrol motion brings them in.
  // Recruitment (nominal command only; the CBF filter is unchanged): while a region holds fewer drones
  // than its target, the closest drones that can be spared (outside both regions first, then drones
  // from the other region beyond that region's own target) fly toward a point inside it instead of
  // following their patrol sinusoid. Returns an array: target x per drone, or null to keep patrolling.
  function recruits(S, tgt){
    const N = S.N, out = new Array(N).fill(null);
    const H = [S.hL1, S.hL2], T = [tgt.r1, tgt.r2], IN = [0, 0];
    for (let j=0;j<N;j++){ if (S.hL1[j] >= 0) IN[0]++; if (S.hL2[j] >= 0) IN[1]++; }
    for (let k=0;k<2;k++){
      let deficit = T[k] - IN[k]; if (deficit <= 0) continue;
      // drones already in region k hold inside it while it fills up (keeps h away from 0, so the
      // min-coupled barrier does not freeze the spare drones that have to cross over)
      for (let j=0;j<N;j++) if (H[k][j] >= 0 && out[j] === null) out[j] = Math.sign(REGIONS[k].cx) * 2.6 * SCALE;
      const o = 1 - k, spareOther = IN[o] - T[o];
      const cand = [];
      for (let j=0;j<N;j++){
        if (H[k][j] >= 0 || out[j] !== null) continue;
        const inOther = H[o][j] >= 0;
        if (inOther && spareOther <= 0) continue;
        cand.push([inOther ? 1 : 0, -H[k][j], j]);
      }
      cand.sort((a,b) => a[0]-b[0] || a[1]-b[1]);
      let taken = 0, takenFromOther = 0;
      for (const [fromOther,, j] of cand){
        if (taken >= deficit) break;
        if (fromOther && takenFromOther >= spareOther) continue;
        out[j] = Math.sign(REGIONS[k].cx) * 2.6 * SCALE;   // inside both arms of the L at any lane
        taken++; if (fromOther) takenFromOther++;
      }
    }
    return out;
  }

  function ratchet(S, eff, tgt){
    const e = { r1: Math.min(eff.r1, tgt.r1), r2: Math.min(eff.r2, tgt.r2) };
    for (let changed = true; changed; ){
      changed = false;
      if (e.r1 < tgt.r1 && barrier(S, e.r1 + 1, e.r2) >= 0){ e.r1++; changed = true; }
      if (e.r2 < tgt.r2 && barrier(S, e.r1, e.r2 + 1) >= 0){ e.r2++; changed = true; }
    }
    return e;
  }

  return { SCALE, NMAX, DT, REGIONS, create, step, counts, barrier, ratchet, recruits, hL, qp2, refreshH };
})();

// SIM-END

const WALLS = [0xe8dcc8, 0xd9c7a8, 0xc9d3dc, 0xe2c9bd, 0xbfcbb4, 0xf0e6d6];

// Lots: a 1 m grid over each (scaled) L; a lot is used if a 0.8 m footprint fits inside.
function lotsIn(reg, sign){
  const lots = [];
  const x0 = 1.5*SC + 0.5, x1 = 5.5*SC - 0.4, y0 = -2*SC + 0.5, y1 = 2*SC - 0.4;
  for (let x = x0; x <= x1 + 1e-9; x += 1.0) for (let y = y0; y <= y1 + 1e-9; y += 1.0)
    if (fits(reg, sign*x, y, 0.4, 0.4)) lots.push([sign*x, y]);

const near = (lots, x, y) => lots.reduce((b, l) => Math.hypot(l[0]-x, l[1]-y) < Math.hypot(b[0]-x, b[1]-y) ? l : b);
const same = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];

// --- L1: research campus — a skyline of mixed heights, HQ tower with antenna, lab dome ---
(function buildCampus(){
  const reg = SIM.REGIONS[0];

function apartment(x, y, w, d, h){

(function buildHomes(){

(function buildRoads(){

// ---------- drone model (procedural quadrotor) ----------
function makeDrone(hex){
  const color = new THREE.Color(hex);
  const root = new THREE.Group();          // position + yaw
  const tilt = new THREE.Group(); root.add(tilt);   // pitch/roll
  const dark = new THREE.MeshStandardMaterial({ color: 0x1d232b, roughness: 0.55, metalness: 0.35 });
  const shell = new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: 0.35, metalness: 0.1 });
  const accent = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.9 });
  const s = 0.34; // scale

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.34*s, 0.12*s, 0.5*s), shell); body.castShadow = true; tilt.add(body);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.16*s, 20, 12, 0, Math.PI*2, 0, Math.PI/2), shell);
  canopy.scale.set(1, 0.55, 1.35); canopy.position.y = 0.06*s; canopy.castShadow = true; tilt.add(canopy);

  const cam = new THREE.Mesh(new THREE.SphereGeometry(0.06*s, 12, 10), dark); cam.position.set(0,-0.08*s,-0.16*s); tilt.add(cam);

  const props = [];
  const armLen = 0.62*s;
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sz], i) => {
    const ang = Math.atan2(sz, sx);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(armLen, 0.04*s, 0.06*s), dark);
    arm.position.set(Math.cos(ang)*armLen/2, 0, Math.sin(ang)*armLen/2);
    arm.rotation.y = -ang; arm.castShadow = true; tilt.add(arm);
    const mx = Math.cos(ang)*armLen, mz = Math.sin(ang)*armLen;
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.05*s, 0.06*s, 0.1*s, 14), dark);
    motor.position.set(mx, 0.03*s, mz); motor.castShadow = true; tilt.add(motor);
    const guard = new THREE.Mesh(new THREE.TorusGeometry(0.27*s, 0.012*s, 6, 36),
      new THREE.MeshStandardMaterial({ color: 0x9aa7b4, roughness: 0.5 }));
    guard.rotation.x = Math.PI/2; guard.position.set(mx, 0.08*s, mz); tilt.add(guard);
    const prop = new THREE.Group(); prop.position.set(mx, 0.09*s, mz);
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2a3138, roughness: 0.4, transparent: true, opacity: 0.9 });
    for (let b=0;b<2;b++){ const bl = new THREE.Mesh(new THREE.BoxGeometry(0.5*s, 0.008*s, 0.05*s), bladeMat);
      bl.rotation.y = b*Math.PI; bl.position.x = 0; prop.add(bl); }
    const disc = new THREE.Mesh(new THREE.CircleGeometry(0.25*s, 28),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false }));
    disc.rotation.x = -Math.PI/2; prop.add(disc);
    prop.userData.dir = (i===0||i===3) ? 1 : -1;
    tilt.add(prop); props.push(prop);
    // arm-tip LEDs (front red/green convention looks nice)
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.022*s, 8, 6),
      new THREE.MeshBasicMaterial({ color: sz < 0 ? (sx>0?0x4ade80:0xf87171) : color }));
    led.position.set(mx, -0.04*s, mz); tilt.add(led);
  });
  return { root, tilt, props };
}

// ---------- per-drone visuals (rebuilt whenever N changes) ----------
let drones = [];
function disposeDrones(){
  drones.forEach(d => [d.root, d.arrow, d.nom, d.ring, d.tether, d.trail, d.lane].forEach(o => {
    scene.remove(o); o.traverse(c => { c.geometry && c.geometry.dispose(); }); }));
  drones = [];
}
function buildDrones(){
  disposeDrones();
  for (let j=0;j<S.N;j++){
    const hex = colorOf(j);
    const d = makeDrone(hex);
    scene.add(d.root);
    // velocity arrow (filtered command u)
    const arrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 0.6, new THREE.Color(hex).getHex(), 0.18, 0.12);
    scene.add(arrow);
    // nominal arrow (u_des), shown optionally
    const nom = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 0.6, 0xffffff, 0.14, 0.09);
    nom.line.material.transparent = true; nom.line.material.opacity = 0.45;
    nom.cone.material.transparent = true; nom.cone.material.opacity = 0.45; nom.visible = false; scene.add(nom);
    // ground marker ring + tether line
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.22, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite:false }));
    ring.rotation.x = -Math.PI/2; scene.add(ring);
    const tether = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
      new THREE.LineDashedMaterial({ color: 0x8b98a5, dashSize: 0.08, gapSize: 0.08, transparent: true, opacity: 0.45 }));
    scene.add(tether);
    // trail
    const TL = 120; const tpos = new Float32Array(TL*3);
    const tgeo = new THREE.BufferGeometry(); tgeo.setAttribute('position', new THREE.BufferAttribute(tpos, 3));
    const trail = new THREE.Line(tgeo, new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity: 0.55 }));
    trail.frustumCulled = false; scene.add(trail);
    // patrol lane (desired back-and-forth range on the ground)
    const A = Math.abs(S.plan.A[j]); const y0 = S.p[j][1];
    const lane = new THREE.Line(new THREE.BufferGeometry().setFromPoints([W(-A,y0,0.015), W(A,y0,0.015)]),
      new THREE.LineDashedMaterial({ color: hex, dashSize: 0.18, gapSize: 0.14, transparent: true, opacity: 0.35 }));
    lane.computeLineDistances(); scene.add(lane);
    nom.visible = $('tNom').checked; trail.visible = $('tTrail').checked; lane.visible = $('tRail').checked;
    drones.push({ ...d, arrow, nom, ring, tether, trail, tpos, tcount: 0, lane, yaw: 0, hex });
  }
}
const $ = id => document.getElementById(id);
buildDrones();

// ---------- HUD ----------
function pips(el, n, total, color){
  el.innerHTML = Array.from({length: total}, (_,i)=>`<span class="pip" style="${i<n?`background:${color}`:''}"></span>`).join('');
}
const chart = $('chart'), cctx = chart.getContext('2d');
function sizeChart(){ const r = chart.getBoundingClientRect(); chart.width = r.width*devicePixelRatio; chart.height = r.height*devicePixelRatio; }
sizeChart();

function drawChart(){
  const w = chart.width, h = chart.height, dpr = devicePixelRatio;
  cctx.clearRect(0,0,w,h);
  const pad = { l: 22*dpr, r: 6*dpr, t: 6*dpr, b: 16*dpr };
  const span = 50, tEnd = Math.max(S.t, span), t0 = tEnd - span;
  const X = t => pad.l + (t - t0)/span*(w-pad.l-pad.r);
  const NN = S.N; const Y = v => h-pad.b - v/NN*(h-pad.t-pad.b);
  cctx.font = `${10*dpr}px IBM Plex Sans, system-ui, sans-serif`; cctx.fillStyle = '#5b6672';
  cctx.strokeStyle = 'rgba(255,255,255,.06)'; cctx.lineWidth = 1;
  for (const v of [...new Set([0, Math.round(NN/4), Math.round(NN/2), Math.round(3*NN/4), NN])]){ cctx.beginPath(); cctx.moveTo(pad.l,Y(v)); cctx.lineTo(w-pad.r,Y(v)); cctx.stroke(); cctx.fillText(v, 4*dpr, Y(v)+3*dpr); }
  for (let tt=Math.ceil(t0/10)*10; tt<=tEnd; tt+=10) cctx.fillText(tt+'s', X(tt)-8*dpr, h-3*dpr);
  // thresholds
  cctx.setLineDash([4*dpr,4*dpr]);
  cctx.strokeStyle = 'rgba(45,212,191,.7)'; cctx.beginPath(); cctx.moveTo(pad.l,Y(params.r1)); cctx.lineTo(w-pad.r,Y(params.r1)); cctx.stroke();
  cctx.strokeStyle = 'rgba(245,165,36,.7)'; cctx.beginPath(); cctx.moveTo(pad.l,Y(params.r2)); cctx.lineTo(w-pad.r,Y(params.r2)); cctx.stroke();
  cctx.strokeStyle = 'rgba(148,163,184,.4)'; cctx.beginPath(); cctx.moveTo(pad.l,Y(NN-params.r1-params.r2)); cctx.lineTo(w-pad.r,Y(NN-params.r1-params.r2)); cctx.stroke();
  cctx.setLineDash([]);
  const series = [['c1','#2dd4bf'],['c2','#f5a524'],['out','#94a3b8']];
  for (const [k,col] of series){
    cctx.strokeStyle = col; cctx.lineWidth = 1.8*dpr; cctx.beginPath();
    let first = true, prev = null;
    for (const s of history){ if (s.t < t0) continue;
      const x = X(s.t), y = Y(s[k] + (k==='c1'?0.06:k==='c2'?-0.06:0));
      if (first){ cctx.moveTo(x,y); first=false; } else { cctx.lineTo(x, Y(prev[k] + (k==='c1'?0.06:k==='c2'?-0.06:0))); cctx.lineTo(x,y); }
      prev = s; }
    cctx.stroke();
  }
}

function updateHUD(){
  const { c1, c2, out } = SIM.counts(S);
  const r1 = params.r1, r2 = params.r2, e1 = eff.r1, e2 = eff.r2;
  $('cL1').textContent = c1; $('cL2').textContent = c2; $('cOut').textContent = out;
  $('qL1').textContent = e1 < r1 ? `≥${e1}→${r1}` : '≥'+r1; $('qL2').textContent = e2 < r2 ? `≥${e2}→${r2}` : '≥'+r2; const N = S.N;
  $('qOut').textContent = '≤'+(N-r1-r2);
  pips($('pipsL1'), c1, N, c1>=r1 ? '#2dd4bf' : c1>=e1 ? '#fbbf24' : '#f87171');
  pips($('pipsL2'), c2, N, c2>=r2 ? '#f5a524' : c2>=e2 ? '#fbbf24' : '#f87171');
  pips($('pipsOut'), out, N, '#94a3b8');
  const hv = SIM.barrier(S, e1, e2), safe = c1>=e1 && c2>=e2, adjusting = e1 < r1 || e2 < r2;
  const st = $('status'); st.className = 'mono ' + (!safe ? 'unsafe' : adjusting ? 'adjust' : 'safe');
  $('statusTxt').textContent = !safe ? 'UNSAFE · coverage lost'
    : adjusting ? `SAFE · filling ${e1 < r1 ? `L₁ ${c1}/${r1}` : ''}${e1 < r1 && e2 < r2 ? ', ' : ''}${e2 < r2 ? `L₂ ${c2}/${r2}` : ''}` : 'SAFE';
  $('hval').textContent = 'h = ' + hv.toFixed(2);
  $('mT').textContent = S.t.toFixed(1)+' s';
  $('mAct').textContent = S.active.filter(Boolean).length + ' / ' + N;
  $('mViol').textContent = violations;
  $('mU').textContent = peakU.toFixed(2);
  // min 3D separation between drones
  let ms = Infinity;
  for (let i=0;i<N;i++) for (let k=i+1;k<N;k++){
    const dx=S.p[i][0]-S.p[k][0], dy=S.p[i][1]-S.p[k][1], dz=ALT[i]-ALT[k];
    ms = Math.min(ms, Math.hypot(dx,dy,dz)); }
  $('mSep').textContent = ms.toFixed(2)+' m';
  regionVis[0].outline.material.color.set(c1>=e1 ? C_L1 : 0xf87171);
  regionVis[1].outline.material.color.set(c2>=e2 ? C_L2 : 0xf87171);
  return { safe, c1, c2, out };
}

// ---------- controls ----------
$('bPlay').onclick = () => { params.playing = !params.playing;
  $('bPlay').textContent = params.playing ? '❚❚ Pause' : '▶ Play'; $('bPlay').className = params.playing ? 'on' : ''; };
function syncTexts(){
  const need = params.r1 + params.r2;
  $('sN').min = Math.max(2, need); $('sN').value = nDrones; $('vN').textContent = nDrones;
  $('sR1').max = Math.min(12, nDrones - params.r2); $('sR2').max = Math.min(12, nDrones - params.r1);
  $('sR1').value = params.r1; $('sR2').value = params.r2;
  $('vR1').textContent = params.r1; $('vR2').textContent = params.r2;
}
function reset(newSeed){
  if (newSeed) seed = (Math.random()*1e9)|0;
  S = SIM.create(seed, nDrones, params.r1, params.r2); eff = { r1: params.r1, r2: params.r2 }; peakU = 0; history = []; violations = 0; wasUnsafe = false;
  computeAlt(); buildDrones(); syncTexts();
}
$('bReset').onclick = () => reset(false);
$('bSeed').onclick = () => reset(true);
$('bFilter').onclick = () => { params.filter = !params.filter;
  $('bFilter').textContent = 'CBF filter: ' + (params.filter ? 'ON' : 'OFF');
  $('bFilter').className = params.filter ? 'on' : 'off'; };
// per-region requirements change the run in place (no restart). The sliders keep r1 + r2 <= N; lowering
// a target applies at once, raising one is phased in by the supervisor as drones arrive.
function setReq(k, v){
  params[k] = v;
  syncTexts();
}
$('sR1').oninput = e => setReq('r1', +e.target.value);
$('sR2').oninput = e => setReq('r2', +e.target.value);
$('sN').oninput = e => { nDrones = Math.max(+e.target.value, params.r1 + params.r2); reset(false); };
$('sU').oninput = e => { const v = +e.target.value;
  params.umax = v > 3.0 ? Infinity : v;
  const t = isFinite(params.umax) ? params.umax.toFixed(2)+' m/s' : 'off';
  $('vU').textContent = t; $('mUB').textContent = t; peakU = 0; };
$('sSpd').oninput = e => { params.speed = +e.target.value; $('vSpd').textContent = params.speed+'×'; };
$('sA').oninput = e => { params.alpha = +e.target.value; $('vA').textContent = params.alpha.toFixed(1); };
$('sRho').oninput = e => { params.rho = +e.target.value; $('vRho').textContent = params.rho.toFixed(params.rho % 1 ? 2 : 1) + (params.rho === 2 ? ' paper' : ''); };
$('tNom').onchange = e => drones.forEach(d => d.nom.visible = e.target.checked);
syncTexts();
$('tTrail').onchange = e => drones.forEach(d => d.trail.visible = e.target.checked);
$('tRail').onchange = e => drones.forEach(d => d.lane.visible = e.target.checked);
$('tRot').onchange = e => { controls.autoRotate = e.target.checked; controls.autoRotateSpeed = 0.6; };

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); sizeChart();
});

// canvas text is drawn once; if the web font was not ready yet, redraw it in IBM Plex Sans when it is
if (document.fonts) document.fonts.load('600 56px "IBM Plex Sans"').then(() => LABEL_REDRAW.forEach(f => f())).catch(() => {});

// ---------- loop ----------
const clock = new THREE.Clock();
let acc = 0, propSpin = 0;
const tmpDir = new THREE.Vector3();
updateHUD();

function frame(){
  const dt = Math.min(clock.getDelta(), 0.1);
  if (params.playing){
    acc += dt * params.speed;
    let n = 0;
    while (acc >= SIM.DT && n < 200){
      // supervisor: recruit drones toward a region below its target, enforce eff, then let eff climb
      const recruit = SIM.recruits(S, params);
      eff = SIM.ratchet(S, eff, params);
      SIM.step(S, { ...params, r1: eff.r1, r2: eff.r2, recruit }); acc -= SIM.DT; n++;
      eff = SIM.ratchet(S, eff, params);
      for (const u of S.u) peakU = Math.max(peakU, Math.abs(u[0]), Math.abs(u[1]));
      const c = SIM.counts(S);
      history.push({ t: S.t, ...c });
      const unsafe = c.c1 < eff.r1 || c.c2 < eff.r2;
      if (unsafe && !wasUnsafe) violations++; wasUnsafe = unsafe;
      if (S.step % 2 === 0) drones.forEach((d,j) => {   // trail sampling
        const TL = d.tpos.length/3;
        if (d.tcount < TL) d.tcount++; d.tpos.copyWithin(3, 0, (TL-1)*3);
        d.tpos[0]=S.p[j][0]; d.tpos[1]=ALT[j]; d.tpos[2]=-S.p[j][1];
      });
    }
    if (history.length > 4000) history.splice(0, history.length - 1200);
    propSpin += dt * 55;
  }
  const hud = updateHUD();

  drones.forEach((d, j) => {
    const [x, y] = S.p[j], [ux, uy] = S.u[j], [dx, dy] = S.ud[j];
    const bob = Math.sin(performance.now()/600 + j*1.7) * 0.025;
    d.root.position.copy(W(x, y, ALT[j] + bob));
    const sp = Math.hypot(ux, uy);
    if (sp > 0.05){ const target = Math.atan2(-uy, ux) ; // heading in world x/z
      let yaw = Math.atan2(uy, ux) - Math.PI/2; // body nose is -z
      let diff = yaw - d.yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); d.yaw += diff * Math.min(1, dt*4); }
    d.root.rotation.y = d.yaw;
    d.tilt.rotation.x = -Math.min(sp, 3) * 0.08;   // pitch forward with speed
    d.props.forEach(p => p.rotation.y = propSpin * p.userData.dir);

    // arrows: filtered command u (colored) and nominal u_des (white)
    const base = W(x, y, ALT[j] - 0.02);
    if (sp > 1e-3){ tmpDir.set(ux, 0, -uy).normalize(); d.arrow.setDirection(tmpDir);
      d.arrow.setLength(0.35 + Math.min(sp, 4)*0.32, 0.18, 0.12); d.arrow.visible = true; }
    else d.arrow.visible = false;
    d.arrow.position.copy(base);
    if ($('tNom').checked){ const ns = Math.hypot(dx, dy);
      if (ns > 1e-3){ tmpDir.set(dx,0,-dy).normalize(); d.nom.setDirection(tmpDir); d.nom.setLength(0.35+Math.min(ns,4)*0.32, 0.14, 0.09); }
      d.nom.position.copy(W(x, y, ALT[j] + 0.1)); d.nom.visible = ns > 1e-3; }

    // ground ring colour = where the drone is counted
    const in1 = S.hL1[j] >= -1e-6, in2 = S.hL2[j] >= -1e-6;
    const rc = in1 ? C_L1 : in2 ? C_L2 : 0x94a3b8;
    d.ring.material.color.set(S.active[j] && params.filter ? 0xffffff : rc);
    const pulse = S.active[j] && params.filter ? 1 + 0.25*Math.sin(performance.now()/90) : 1;
    d.ring.scale.setScalar(pulse);
    d.ring.position.copy(W(x, y, 0.02));
    const tp = d.tether.geometry.attributes.position.array;
    tp[0]=x; tp[1]=0.02; tp[2]=-y; tp[3]=x; tp[4]=ALT[j]-0.1; tp[5]=-y;
    d.tether.geometry.attributes.position.needsUpdate = true; d.tether.computeLineDistances();
    d.trail.geometry.setDrawRange(0, d.tcount); d.trail.geometry.attributes.position.needsUpdate = true;
  });

  const nowMs = performance.now();
  beacons.forEach(b => { b.visible = Math.floor(nowMs/650 + b.userData.ph) % 2 === 0; });
  drawChart();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
