</style></head><body><script>// ---- WebGPU batch evaluator for Discrete MBD -------------------------------
// Scores N candidate key matrices in parallel: one GPU thread = one sample.
// The kernel mirrors the CPU cost (greedy-cover decoder + precedence-aware scheduler + makespan).
window.MBDGpu = (() => {
  const MAXR = 40, MAXT = 24, MAXC = 19, MAXL = 32;
  const WGSL = /* wgsl */`
struct P { R:u32, T:u32, C:u32, L:u32, N:u32, stride:u32, p4:u32, hasTie:u32, hasPred:u32, penalty:f32,
  oNeed:u32, oDur:u32, oTravel:u32, oDepot:u32, oPred:u32, oTie:u32, p0:u32, p1:u32, p2:u32, p3:u32 };
@group(0) @binding(0) var<uniform> P_: P;
@group(0) @binding(1) var<storage, read> fd: array<f32>;   // cap | need | dur | travel
@group(0) @binding(2) var<storage, read> idt: array<i32>;  // reach | depot | pred | tie
@group(0) @binding(3) var<storage, read> samples: array<u32>;
@group(0) @binding(4) var<storage, read_write> outc: array<f32>;
fn cap(i:u32) -> f32 { return fd[i]; }
fn need(i:u32) -> f32 { return fd[P_.oNeed + i]; }
fn dur(i:u32) -> f32 { return fd[P_.oDur + i]; }
fn travel(i:u32) -> f32 { return fd[P_.oTravel + i]; }
fn reach(i:u32) -> u32 { return u32(idt[i]); }
fn depot(i:u32) -> u32 { return u32(idt[P_.oDepot + i]); }
fn pred(i:u32) -> i32 { return idt[P_.oPred + i]; }
fn tie(i:u32) -> i32 { return idt[P_.oTie + i]; }

var<private> mem: array<u32, ${MAXT * 2}>;
var<private> u: array<f32, ${MAXC}>;

fn key(s:u32, i:u32) -> f32 {
  let w = samples[s * P_.stride + i / 4u];
  return f32((w >> (8u * (i % 4u))) & 255u);
}
fn setm(r:u32, c:u32) { mem[c*2u + r/32u] = mem[c*2u + r/32u] | (1u << (r % 32u)); }
fn getm(r:u32, c:u32) -> bool { return (mem[c*2u + r/32u] & (1u << (r % 32u))) != 0u; }
fn shortfall(c:u32) -> f32 {
  var s = 0.0;
  for (var b = 0u; b < P_.C; b++) { s += max(need(c*P_.C+b) - u[b], 0.0); }
  return s;
}
fn covered(c:u32) -> bool {
  for (var b = 0u; b < P_.C; b++) { if (u[b] < need(c*P_.C+b)) { return false; } }
  return true;
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let s = gid.x;
  if (s >= P_.N) { return; }
  let R = P_.R; let T = P_.T; let C = P_.C; let L = P_.L;
  for (var i = 0u; i < ${MAXT * 2}u; i++) { mem[i] = 0u; }
  var prio: array<f32, ${MAXT}>;
  var short = 0.0;

  // ---- decoder: keys -> team per task --------------------------------------
  for (var c = 0u; c < T; c++) {
    if (P_.hasTie != 0u && tie(c) >= 0) { continue; }
    for (var b = 0u; b < C; b++) { u[b] = 0.0; }
    var lst: array<u32, ${MAXR}>; var lv: array<f32, ${MAXR}>; var nl = 0u;
    // (a) coalition formation: reachable robots from highest to lowest priority (ascending key),
    //     added only while they reduce the unmet requirement; ties by robot index
    {
      for (var p = 0u; p < R; p++) {
        if (reach(p*T+c) == 0u) { continue; }
